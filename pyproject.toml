[project]
name = "brawlfarm"
version = "1.1.0"
description = "Computer vision automation for Brawl Stars on BlueStacks, with a local control panel"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
keywords = ["brawl-stars", "bluestacks", "automation", "adb", "farming"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "opencv-python>=4.10",
  "numpy>=2.0",
  "requests>=2.32",
  "python-dotenv>=1.0",
  "rapidocr-onnxruntime>=1.3",
  "pandas>=2.2",
  "pydantic>=2.9",
  "tomli-w>=1.1",
  "psutil>=6.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/as9pa/brawlfarm"
Repository = "https://github.com/as9pa/brawlfarm"
Issues = "https://github.com/as9pa/brawlfarm/issues"
Changelog = "https://github.com/as9pa/brawlfarm/releases"

[project.scripts]
brawlfarm = "brawlfarm.__main__:main"

# The desktop dependencies live twice on purpose: the group is what a clone syncs with
# `uv sync --group desktop`, the extra is what an install from PyPI asks for with
# `brawlfarm[desktop]`. Keep the two lists identical.
[project.optional-dependencies]
desktop = ["pywebview>=5.3", "pystray>=0.19", "pillow>=10"]
# The play extras: PyAV decodes the scrcpy stream; onnxruntime-gpu runs the detector on CUDA.
# The cuda and cudnn extras bring NVIDIA's runtime wheels; without them the CUDA provider
# cannot load on a machine that has only the display driver.
# Keep each list identical to its dependency group below.
play = ["av>=14"]
play-gpu = ["av>=14", "onnxruntime-gpu[cuda,cudnn]>=1.21"]

[dependency-groups]
# av is in dev as well so the decoder tests run in CI; the tests skip when it is absent.
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.12", "httpx>=0.27", "av>=14", "yt-dlp>=2025.1"]
# The dataset kit under tools/play: yt-dlp downloads source video, PyAV decodes it. Tools are
# not in the wheel, so this group has no extra beside it.
dataset = ["yt-dlp>=2025.1", "av>=14"]
desktop = ["pywebview>=5.3", "pystray>=0.19", "pillow>=10"]
play = ["av>=14"]
play-gpu = ["av>=14", "onnxruntime-gpu[cuda,cudnn]>=1.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brawlfarm"]
# The panel is built by pnpm and git ignores brawlfarm/web/dist, so hatchling's VCS-aware
# file selection drops it: artifacts force it back in. The sources that produced it are
# excluded in turn -- a wheel carries the built page, never the TypeScript behind it.
artifacts = ["brawlfarm/web/dist/**"]
exclude = [
  "brawlfarm/web/src",
  "brawlfarm/web/public",
  "brawlfarm/web/node_modules",
  "brawlfarm/web/*.json",
  "brawlfarm/web/*.ts",
  "brawlfarm/web/*.html",
  "brawlfarm/web/*.yaml",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".pytest_cache"
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
# Two import-time deprecations from the TestClient's own dependencies, scoped to their
# exact message so any other deprecation still surfaces. Drop each one when its emitter
# is upgraded past it.
filterwarnings = [
  # starlette 1.6.0 prefers httpx2 and warns on the httpx fallback; the plan pins httpx.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
  # starlette 1.6.0's module body still uses the alias anyio 4.15 deprecated.
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
